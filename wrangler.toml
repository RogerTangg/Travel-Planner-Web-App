name = "travel-planner"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
# Environment variables (non-sensitive)

# Note: API Keys should be set as secrets in Cloudflare Dashboard
# Dashboard > Pages > travel-planner > Settings > Environment variables
#
# Required secrets:
# - GEMINI_API_KEY: Google Gemini AI API Key
# - GOOGLE_MAPS_API_KEY: Google Maps Platform API Key (for Places API, Geocoding API)
